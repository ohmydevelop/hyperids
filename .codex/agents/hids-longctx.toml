  generator_agent ("hids_longctx"), generation (4), parent_id (<seed id>), source_family ("synthetic"),
  target_shell, expected_verdict, expected_actions
plus an extra field n_tokens_estimate (your integer estimate) and length_bucket ("over_318_windowed").

CONSTRUCTION PATTERNS (mix all of them; each line picks one and it must be the dominant reason for length):
  A. multi-stage chain: a benign-looking reconnaissance/context stage -> staging -> the seed's core mechanism -> cleanup/persistence, joined with &&, ;, or separate lines inside one string.
  B. scripted body: a short inline shell/python/powershell loop or heredoc that carries the seed behavior through several steps.
  C. session transcript style: a sequence of numbered or comment-prefixed steps presented as an operator session.
  D. config/echo scaffolding: several echo/printf/sed/cat lines that set up environment then invoke the seed behavior.
Keep the security-relevant semantics of the parent seed, keep it as a single `command` string, and keep it plausible on the declared target_shell.

HARD RULES:
1. Placeholders only: addresses from 192.0.2.0/24 / 198.51.100.0/24 / 203.0.113.0/24 / example.com / example.org / example.net; paths under /tmp/hids-lab/... or /var/tmp/hids-lab/... . No real IPs, domains, credentials, tokens, keys, or callbacks.
2. Never export real secrets; use obvious placeholders such as LAB_TOKEN, REDACTED, or synthetic values.
3. expected_verdict / expected_actions come from the seed's declared intent, NOT from any model result. Keep them consistent with the seed unless the longer framing clearly changes what the command does (then keep it minimal and defensible).
4. Prefer variety: cover many different seed categories/families and many different padding mechanisms; do not emit near-duplicate rows. Normalized-whitespace command text must be unique across your file and should not duplicate any input seed command.
5. Do not write any file other than your output file. Do not read wave1/2/3 raw files, results, or other arms' outputs; only the seeds file above.
6. Output must be valid JSONL, one object per line, no prose, no markdown fences.

Before finishing, self-check: line count in 160-200, every line valid JSON, every `command` a single string with estimated tokens > 318, ids unique and prefixed "w4-lc-", every parent_id present in the seeds file. Report ONLY: output path, line count, id/family coverage summary, token-bucket estimate, and any uncertainty.
