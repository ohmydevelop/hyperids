version: 2.0.0
task_type: multi_label_classification
verdict:
- id: verdict.benign
  description: Legitimate administrative, operational, or development command with
    no malicious intent and no security impact.
- id: verdict.suspicious
  description: Dual-use or ambiguous command; could be benign administration or attacker
    tradecraft, context alone does not confirm malice.
- id: verdict.malicious
  description: Command clearly performs offensive, evasive, destructive, or exfiltrative
    activity consistent with attacker tradecraft.
action:
- id: action.download
  description: Download a file or payload from a remote source without executing it.
  tactics:
  - command_and_control
  techniques:
  - T1105
- id: action.execute_local
  description: Execute a local file, script, or binary.
  tactics:
  - execution
  techniques:
  - T1059
- id: action.download_execute
  description: Download and immediately execute a remote payload.
  tactics:
  - execution
  - command_and_control
  techniques:
  - T1204
  - T1105
- id: action.command_and_control
  description: Beacon or check in to a remote command-and-control channel.
  tactics:
  - command_and_control
  techniques:
  - T1071
- id: action.obfuscate
  description: Encode, encrypt, or otherwise obfuscate a command or payload.
  tactics:
  - defense_evasion
  techniques:
  - T1027
- id: action.file_operation
  description: Create, modify, move, copy, or destroy files.
  tactics:
  - collection
  - impact
  techniques:
